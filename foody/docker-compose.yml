services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: foody:latest
    container_name: foody_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (overrides .env localhost)
      - POSTGRES_HOST=foody_postgres
      - REDIS_HOST=foody_redis
      - MINIO_ENDPOINT=foody_minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - foody

  postgres:
    image: postgres:16-alpine
    container_name: foody_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-foody}
    volumes:
      - foody_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-foody}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foody

  redis:
    image: redis:7-alpine
    container_name: foody_redis
    restart: unless-stopped
    volumes:
      - foody_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foody

  minio:
    image: minio/minio:latest
    container_name: foody_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - foody_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - foody

volumes:
  foody_postgres:
  foody_redis:
  foody_minio:

networks:
  foody:
    driver: bridge
